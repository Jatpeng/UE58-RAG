[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue58-rag"
version = "0.1.0"
description = "Developer RAG foundations for Unreal Engine 5.8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "qdrant-client>=1.9",
    "mcp[cli]>=1.0,<2",
    "rich>=13.7",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-cpp>=0.23.4,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
eval = [
    "ragas==0.4.3",
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.30,<0.4",
    "langchain-core>=0.3.75,<1",
    "langchain-openai>=0.3.30,<0.4",
    "rapidfuzz>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
