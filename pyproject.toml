[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue58-rag"
version = "0.1.0"
description = "Developer RAG foundations for Unreal Engine 5.8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "qdrant-client>=1.9",
    "rich>=13.7",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
