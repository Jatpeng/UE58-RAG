input: "data/chunks/engine/chunks.jsonl"
sources_output: "data/benchmark/ragas_sources.jsonl"
knowledge_graph_output: "data/benchmark/ragas_knowledge_graph.json"
testset_output: "data/benchmark/ragas_testset.jsonl"
benchmark_output: "data/benchmark/ragas_cases.jsonl"
documents: 180
testset_size: 100
oversample_factor: 1.25
seed: 58
min_chars: 400
max_chars: 12000
max_per_stratum: 4
llm:
  model: "gpt-4o-mini"
  context: "Generate technically precise Simplified Chinese questions and reference answers for Unreal Engine 5.8 C++ developers. Preserve C++ symbol names in English."
  base_url: null
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.2
  timeout_seconds: 180
  max_retries: 3
  max_workers: 4
embedding:
  model: "Qwen/Qwen3-Embedding-0.6B"
  device: "cuda"
  batch_size: 8
personas:
  - name: "UE_CPP_ENGINEER"
    role_description: "Senior Unreal Engine C++ developer investigating runtime APIs, symbols, modules, and implementation details."
  - name: "UE_EDITOR_TOOLS_ENGINEER"
    role_description: "Unreal Engine editor tools developer working with Slate, details customization, plugins, and asset workflows."
  - name: "UE_TECHNICAL_ARTIST"
    role_description: "Technical artist integrating rendering, animation, Niagara, materials, and editor workflows with C++ systems."
